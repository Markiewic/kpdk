name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-linux-sdk:
    name: Quality and SDK smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Check Linux installer syntax
        run: bash -n scripts/install-kpdk.sh
      - name: Prepare Easy PDK Programmer
        run: bash scripts/prepare-easypdkprog.sh "$RUNNER_TEMP/easypdkprog"
      - name: Install SDK and build a PFS154 project
        env:
          KPDK_EASYPDKPROG: ${{ runner.temp }}/easypdkprog
        run: |
          cargo run -- sdk install
          test ! -e "$HOME/.local/share/kpdk/toolchains/2026.1/bin/easypdkprog"
          cargo run -- doctor
          cargo run -- new smoke --device PFS154
          sed -i '1i#include "delay.h"' smoke/src/main.c
          sed -i '/while (1) {/a\        _delay_ms(1);' smoke/src/main.c
          python3 -m json.tool smoke/.vscode/c_cpp_properties.json >/dev/null
          python3 -m json.tool smoke/.vscode/tasks.json >/dev/null
          python3 -m json.tool smoke/.vscode/extensions.json >/dev/null
          python3 -m json.tool smoke/compile_commands.json >/dev/null
          test -f smoke/.vscode/kpdk-intellisense.h
          cargo run -- build --project smoke --release

  platform-sdk:
    name: SDK smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            programmer: easypdkprog.exe
          - os: ubuntu-24.04-arm
            programmer: easypdkprog
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "./scripts/install-kpdk.ps1"),
            [ref] $tokens,
            [ref] $errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            throw ($errors | Out-String)
          }
      - name: Prepare Easy PDK Programmer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-easypdkprog.ps1 "$env:RUNNER_TEMP/easypdkprog.exe"
      - name: Prepare Easy PDK Programmer (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/prepare-easypdkprog.sh "$RUNNER_TEMP/easypdkprog"
      - name: Install SDK and build a PFS154 project
        env:
          KPDK_EASYPDKPROG: ${{ runner.temp }}/${{ matrix.programmer }}
        run: |
          cargo run -- sdk install
          cargo run -- doctor
          cargo run -- new smoke --device PFS154
          cargo run -- build --project smoke --release

      - name: Ensure programmer is not copied into SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $legacy = Join-Path $env:LOCALAPPDATA "kpdk/toolchains/2026.1/bin/easypdkprog.exe"
          if (Test-Path $legacy) {
            throw "easypdkprog must remain outside the SDK: $legacy"
          }

      - name: Ensure programmer is not copied into SDK (Linux)
        if: runner.os == 'Linux'
        run: test ! -e "$HOME/.local/share/kpdk/toolchains/2026.1/bin/easypdkprog"

      - name: Validate generated VS Code integration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content smoke/.vscode/c_cpp_properties.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content smoke/.vscode/tasks.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content smoke/.vscode/extensions.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content smoke/compile_commands.json -Raw | ConvertFrom-Json | Out-Null
          if (-not (Test-Path smoke/.vscode/kpdk-intellisense.h)) {
            throw "missing IntelliSense compatibility header"
          }
          if (-not (Select-String -Path smoke/.vscode/c_cpp_properties.json -SimpleMatch "toolchains")) {
            throw "VS Code includePath does not point at the installed kpdk SDK"
          }

  macos-test:
    name: Test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
