[package]
name = "kpdk"
version = "0.1.0"
edition = "2021"
description = "A friendly project and toolchain frontend for free-pdk"
license = "MIT"
repository = "https://github.com/Markiewic/kpdk"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
