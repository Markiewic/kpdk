[package]
name = "kpdk"
version = "0.1.0"
edition = "2021"
description = "A friendly project and toolchain frontend for free-pdk"
license = "MIT"
repository = "https://github.com/Markiewic/kpdk"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

