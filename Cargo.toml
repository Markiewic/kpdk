[package]
name = "kpdk"
version = "0.1.0"
edition = "2021"
description = "A friendly project and toolchain frontend for free-pdk"
license = "MIT"
repository = "https://github.com/Markiewic/kpdk"

[dependencies]
bzip2 = "0.6"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rmcp = { version = "3.1", features = ["schemars", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "rt"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
